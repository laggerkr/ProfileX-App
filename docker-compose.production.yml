name: profilex-production
services:
  postgres:
    image: postgres:16-alpine
    container_name: profilex-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profilex}
      POSTGRES_USER: ${POSTGRES_USER:-profilex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profilex} -d ${POSTGRES_DB:-profilex}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: profilex-redis
    profiles: ["redis"]
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: profilex-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/backend/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4387
      DATABASE_URL: postgresql://${POSTGRES_USER:-profilex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-profilex}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4387}:4387"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4387/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: profilex-nginx
    profiles: ["nginx"]
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-api.profilex.com.ua.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:
