server {
  listen 80;
  server_name app.profilex.com.ua;
  root /var/www/profilex-app;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name app.profilex.com.ua;
  root /var/www/profilex-app;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/app.profilex.com.ua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.profilex.com.ua/privkey.pem;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css text/plain text/xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
