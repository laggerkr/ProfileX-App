map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server { listen 80; server_name api.profilex.com.ua; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name api.profilex.com.ua;
  ssl_certificate /etc/letsencrypt/live/api.profilex.com.ua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.profilex.com.ua/privkey.pem;
  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:4387;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ws {
    proxy_pass http://127.0.0.1:4387;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
